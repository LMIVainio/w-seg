[project]
name = "w-seg-napari"
version = "0.3.53"
description = "Segmentation tool for plant tissue plastic sections stained with toluidine blue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Leo Vainio"},
  {email = "leo.vainio@helsinki.fi"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"
# napari can be included in dependencies if napari imports are required.
# However, you should not include napari[all], napari[qt],
# or any other Qt bindings directly (e.g. PyQt5, PySide2).
# See best practices: https://napari.org/stable/plugins/building_a_plugin/best_practices.html
dependencies = [
    # Core GUI & Visualization
    "napari>=0.4.19",
    "magicgui>=0.8.0",
    "qtpy>=2.4.0",

    # Arrays & Processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-image>=0.23.0",
    "pillow>=10.0.0",
    "h5py>=3.8.0",
    "tifffile>=2023.3.15",
    "shapely>=2.0.0",

    # Deep Learning & Computer Vision
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "keras>=3.0.0",
    "ultralytics>=8.1.0",
    "kornia>=0.7.0",
    "opencv-python-headless>=4.8.0",

    # Specialized Segmentation (GASP/RAGs)
    "python-elf>=0.4.0",
]

[project.optional-dependencies]
# Allow easily installation with the full, default napari installation
# (including Qt backend) using w-seg[all].
all = ["napari[all]"]

[dependency-groups]
dev = [
    "tox-uv",
    "pytest",  # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari[qt]",  # test with napari's default Qt bindings
]

[project.entry-points."napari.manifest"]
w-seg-napari = "w_seg_napari:napari.yaml"



[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/w_seg_napari/_version.py"
fallback_version = "0.0.1+nogit"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
# filterwarnings = ["error"]  # recommended by PP309; deprecation warnings cause failures so leaving for the user to enable if desired
log_cli_level = "INFO"
testpaths = ["tests"]

[tool.ruff]
line-length = 79
fix = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501",
    "UP006", "UP007",
    "SIM102", "SIM105",   # nested if / try-except-pass: style only
    "B905",               # zip() without strict=: style only
    "BLE001",             # blind `except Exception`: fine for the batch worker
]
